<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Card Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-1: #020817;
            --bg-2: #0f172a;
            --bg-3: #1e293b;
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --line: rgba(255, 255, 255, 0.14);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, rgba(59, 130, 246, 0.22), transparent 30%),
                        linear-gradient(135deg, var(--bg-1), var(--bg-2) 42%, var(--bg-3));
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            padding: 30px 16px;
        }

        .grid {
            width: min(1100px, 100%);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            padding: 30px 0;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 26px 22px 24px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.38);
            backdrop-filter: blur(10px);
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
            isolation: isolate;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0 auto auto 0;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.09);
            filter: blur(18px);
            border-radius: 50%;
            transform: translate(-30%, -25%);
            z-index: -1;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.5);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .card h3 {
            font-size: 1.35rem;
            margin-bottom: 10px;
            color: #f8fafc;
            letter-spacing: 0.02em;
        }

        .card p {
            font-size: 0.96rem;
            line-height: 1.7;
            color: var(--muted);
        }

        .card:nth-child(1) {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(14, 165, 233, 0.12));
        }

        .card:nth-child(2) {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(45, 212, 191, 0.12));
        }

        .card:nth-child(3) {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.18), rgba(244, 114, 182, 0.12));
        }

        .card:nth-child(4) {
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.18), rgba(249, 115, 22, 0.12));
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">
            <h3>Mohit</h3>
            <p>Web Developer</p>
        </div>

        <div class="card">
            <h3>Mohit Pachauri</h3>
            <p>Creative Frontend Designer</p>
        </div>

        <div class="card">
            <h3>UI/UX Enthusiast</h3>
            <p>Focused on clean interfaces and interactive experiences.</p>
        </div>

        <div class="card">
            <h3>Designer + Developer</h3>
            <p>Building modern digital experiences with code and creativity.</p>
        </div>
    </div>
</body>
</html>
