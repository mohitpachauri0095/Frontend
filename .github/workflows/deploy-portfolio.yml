name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "HTML/flipbox/index.html"
      - "HTML/flipbox/mohitpachauri ji.jpeg"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare portfolio site
        run: |
          mkdir -p _site
          cp "HTML/flipbox/index.html" _site/index.html
          cp "HTML/flipbox/mohitpachauri ji.jpeg" "_site/mohitpachauri ji.jpeg"

      - name: Upload portfolio site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
